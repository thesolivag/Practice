services:
  - type: web
    name: bishop-miniapp
    runtime: python
    branch: claude-bishop-aggressive
    buildCommand: pip install -r bishop/requirements.txt
    startCommand: uvicorn bishop.runtime:create_hosted_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BISHOP_DATABASE_URL
        sync: false
      - key: BISHOP_DATABASE_PASSWORD
        sync: false
      - key: BISHOP_DATABASE_CA
        sync: false
      - key: BISHOP_TELEGRAM_BOT_TOKEN
        sync: false
      - key: BISHOP_CRON_ENABLED
        value: 'false'
      - key: BISHOP_CRON_SECRET
        sync: false
      - key: BISHOP_GH_DISPATCH_TOKEN
        sync: false
