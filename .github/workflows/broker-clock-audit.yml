name: Broker candle clock audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: broker-clock-audit, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_ENV: demo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "protobuf>=3.20" pandas requests pymysql
      - name: Read broker H4 candle timestamps
        run: python -m slk.broker_clock_audit > broker-clock-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: broker-clock-audit
          path: broker-clock-audit.json
          retention-days: 7
      - run: cat broker-clock-audit.json
