name: FZ-ASM Full-Year Backtest

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Full calendar year to backtest (e.g. 2025)"
        required: true
        default: "2025"
      confirmation_tf:
        description: "Lower-TF confirmation (direct h1_av always uses H1)"
        type: choice
        options: [M5, M10, M15]
        default: M5
      stop_mode:
        description: "Compare stops on identical entry signals"
        type: choice
        options: [both, hourly_sweep, ltf_invalidation]
        default: both
      entry_policy:
        description: "MSS + retest, or older entry routes"
        type: choice
        options: [mss_retest, legacy, h1_av, swing_fvg, swing_ob, h1_av_m5]
        default: mss_retest
      calendar_timezone:
        description: "Provider candle anchor (UTC = research calendar; set verified broker timezone)"
        default: UTC
      pairs:
        description: "Comma-separated list of symbols (empty = all Asian JPY + Gold + EURUSD + GBPUSD)"
        required: false
        default: "USDJPY,GBPJPY,EURJPY,AUDJPY,CADJPY,CHFJPY,NZDJPY,XAUUSD,EURUSD,GBPUSD"
      out:
        description: "Output directory for backtest reports and trade logs"
        required: false
        default: "reports/repaired"

permissions:
  contents: read

concurrency:
  group: fzasm-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      IN_YEAR: ${{ inputs.year || '2025' }}
      IN_PAIRS: ${{ inputs.pairs || 'USDJPY,GBPJPY,EURJPY,AUDJPY,CADJPY,CHFJPY,NZDJPY,XAUUSD,EURUSD,GBPUSD' }}
      IN_OUT: ${{ inputs.out || 'reports/repaired' }}
      CONFIRMATION_TF: ${{ inputs.confirmation_tf || 'M5' }}
      STOP_MODE: ${{ inputs.stop_mode || 'both' }}
      ENTRY_POLICY: ${{ inputs.entry_policy || 'mss_retest' }}
      CALENDAR_TIMEZONE: ${{ inputs.calendar_timezone || 'UTC' }}
      SLK_STORE: data/store

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify FZ-ASM Strategy Integrity
        run: |
          python -m pytest tests/test_fzasm.py tests/test_fzasm_audit.py tests/test_fzasm_repaired.py tests/test_fzasm_stop_study.py tests/test_fzasm_av.py tests/test_fzasm_reference.py tests/test_fzasm_h1_m5.py -q

      - name: Restore candle store cache
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: fzasm-m1-v1-${{ env.IN_YEAR }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fzasm-m1-v1-${{ env.IN_YEAR }}-

      - name: Run FZ-ASM Full-Year Multi-Target Backtest
        id: bt
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: demo
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
        run: |
          mkdir -p "$IN_OUT"
          echo "Starting FZ-ASM Backtest for $IN_YEAR..."
          python -m fzasm.backtest --year "$IN_YEAR" --pairs "$IN_PAIRS" --out "$IN_OUT" --confirmation-tf "$CONFIRMATION_TF" --calendar-timezone "$CALENDAR_TIMEZONE" --stop-mode "$STOP_MODE" --entry-policy "$ENTRY_POLICY" --download-m1
          rc=$?
          echo "Backtest completed with exit code: $rc"
          exit $rc

      - name: Save candle store cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/store
          key: fzasm-m1-v1-${{ env.IN_YEAR }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Backtest Reports & Trade Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fzasm-repaired-${{ env.IN_YEAR }}-${{ env.ENTRY_POLICY }}-${{ env.STOP_MODE }}
          path: ${{ env.IN_OUT }}/

