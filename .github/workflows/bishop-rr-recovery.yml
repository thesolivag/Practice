name: Mini-app Bishop study — verified M1 recovery
on:
  push:
    branches: [research/bishop-oc-h12-20261114]
    paths: [.github/workflows/bishop-rr-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bishop-rr-panel-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pymysql requests websocket-client 'protobuf>=3.20' pytest
      - run: python -m pytest -q tests/test_bishop_unknown_jobs.py tests/test_bishop_rr_recover.py
      - name: Recover proven study outcomes with verified primary M1 data
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: demo
        run: python -m slk.bishop_rr_recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bishop-rr-recovery
          path: reports/rr-recovery/
          retention-days: 7
          if-no-files-found: warn
