# Research acquisition polls the feed lock without blocking database reads.
name: Bishop 2026 causal comparison
on:
  workflow_dispatch:
  push:
    branches: [claude-kevin-king]
    paths: ['.github/workflows/bishop-year.yml']
permissions:
  contents: read
concurrency:
  group: bishop-year-research
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pairs: ${{ steps.prepare.outputs.pairs }}
    env:
      SLK_STORE: data/year-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pymysql requests websocket-client 'protobuf>=3.20' pytest
      - name: Prefix, freezing and ambiguity regression tests
        run: python -m pytest -q tests/test_bishop_year_replay.py tests/test_bishop_flow.py tests/test_bishop_rr.py tests/test_bishop_web_bias.py
      - uses: actions/cache/restore@v4
        with:
          path: data/store
          key: year-read-only-${{ github.run_id }}
          restore-keys: |
            live-candles-v1-
            candles-v3-
      - name: Copy cache into isolated research store
        run: |
          mkdir -p data/year-store
          if [ -d data/store ]; then cp -a data/store/. data/year-store/; fi
      - name: Snapshot selected markets and primary historical candles
        id: prepare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1410229777' }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: demo
        run: python -m slk.bishop_year_jobs prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year-inputs
          path: year-inputs/
          retention-days: 30
          overwrite: true
  pilot:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pymysql requests websocket-client 'protobuf>=3.20'
      - uses: actions/download-artifact@v4
        with: {name: year-inputs, path: year-inputs}
      - name: Physical-prefix and poisoned-future audit plus 24-hour benchmark
        run: python -m slk.bishop_year_jobs pilot --out pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: year-pilot, path: pilot/, retention-days: 30}
  q1:
    needs: [prepare, pilot]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        pair: ${{ fromJSON(needs.prepare.outputs.pairs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pymysql requests websocket-client 'protobuf>=3.20'
      - uses: actions/download-artifact@v4
        with: {name: year-inputs, path: year-inputs}
      - name: Replay segment 1 with frozen carry-over
        env:
          REPLAY_PAIR: ${{ matrix.pair }}
        run: python -m slk.bishop_year_jobs segment --pair "$REPLAY_PAIR" --number 1 --out result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year-1-${{ matrix.pair }}
          path: result/
          retention-days: 30
  q2:
    needs: [prepare, q1]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        pair: ${{ fromJSON(needs.prepare.outputs.pairs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pymysql requests websocket-client 'protobuf>=3.20'
      - uses: actions/download-artifact@v4
        with: {name: year-inputs, path: year-inputs}
      - uses: actions/download-artifact@v4
        with: {name: 'year-1-${{ matrix.pair }}', path: previous}
      - name: Replay segment 2 with frozen carry-over
        env:
          REPLAY_PAIR: ${{ matrix.pair }}
        run: python -m slk.bishop_year_jobs segment --pair "$REPLAY_PAIR" --number 2 --out result --resume previous/checkpoint.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year-2-${{ matrix.pair }}
          path: result/
          retention-days: 30
  q3:
    needs: [prepare, q2]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        pair: ${{ fromJSON(needs.prepare.outputs.pairs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pymysql requests websocket-client 'protobuf>=3.20'
      - uses: actions/download-artifact@v4
        with: {name: year-inputs, path: year-inputs}
      - uses: actions/download-artifact@v4
        with: {name: 'year-2-${{ matrix.pair }}', path: previous}
      - name: Replay segment 3 with frozen carry-over
        env:
          REPLAY_PAIR: ${{ matrix.pair }}
        run: python -m slk.bishop_year_jobs segment --pair "$REPLAY_PAIR" --number 3 --out result --resume previous/checkpoint.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year-3-${{ matrix.pair }}
          path: result/
          retention-days: 30
  q4:
    needs: [prepare, q3]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        pair: ${{ fromJSON(needs.prepare.outputs.pairs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pymysql requests websocket-client 'protobuf>=3.20'
      - uses: actions/download-artifact@v4
        with: {name: year-inputs, path: year-inputs}
      - uses: actions/download-artifact@v4
        with: {name: 'year-3-${{ matrix.pair }}', path: previous}
      - name: Replay segment 4 with frozen carry-over
        env:
          REPLAY_PAIR: ${{ matrix.pair }}
        run: python -m slk.bishop_year_jobs segment --pair "$REPLAY_PAIR" --number 4 --out result --resume previous/checkpoint.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year-4-${{ matrix.pair }}
          path: result/
          retention-days: 30
  report:
    needs: [prepare, pilot, q1, q2, q3, q4]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pymysql requests websocket-client 'protobuf>=3.20'
      - uses: actions/download-artifact@v4
        with: {path: collected}
      - name: Publish complete and incomplete coverage honestly
        run: python -m slk.bishop_year_jobs collect --inputs collected/year-inputs --results collected --out report
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: year-report, path: report/, retention-days: 30}
