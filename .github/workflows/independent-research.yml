name: Independent SPY research
on:
  push:
    branches: [research/independent-spy-20261114]
    paths: [independent-research/**, .github/workflows/independent-research.yml]
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install exchange-calendars==4.13.3
      - name: Bounded development and validation batch
        run: python independent-research/research.py
      - uses: actions/upload-artifact@v4
        with:
          name: independent-spy-screen
          path: independent-research/results/
      - name: Save reports on research branch
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add independent-research/results
          git commit -m 'Record independent SPY screening results [skip ci]'
          git push origin HEAD:research/independent-spy-20261114
