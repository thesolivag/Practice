name: ASM expanded monthly study — JPY gold majors 2026
on:
  push:
    branches: [FZ-ASM]
    paths: ['.github/workflows/fzasm-h1-comparison.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fzasm-h1-comparison
  cancel-in-progress: true
# Fixed once for all jobs: no pair gets a later outcome horizon.
env:
  STUDY_AS_OF: '2026-11-12T00:00:00Z'
  STUDY_YEAR: '2026'
jobs:
  backtest:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair: [USDJPY, EURJPY, GBPJPY, AUDJPY, NZDJPY, CADJPY, CHFJPY, XAUUSD, EURUSD, GBPUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STUDY_PAIR: ${{ matrix.pair }}
      SLK_STORE: data/store
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Verify timing, target accounting and monthly reconciliation
        run: PYTHONPATH=. pytest -q tests/test_fzasm*.py
      - uses: actions/cache/restore@v4
        with:
          path: data/store
          key: fzasm-study-m1-${{ env.STUDY_YEAR }}-${{ matrix.pair }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fzasm-study-m1-${{ env.STUDY_YEAR }}-${{ matrix.pair }}-
            fzasm-m1-v1-${{ env.STUDY_YEAR }}-${{ matrix.pair }}-
            fzasm-m1-v1-${{ env.STUDY_YEAR }}-
      - name: Continuous replay with monthly report checkpoints
        timeout-minutes: 335
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: demo
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
        run: |
          python -m fzasm.study --pair "$STUDY_PAIR" --year "$STUDY_YEAR" --as-of "$STUDY_AS_OF" --out reports/expanded-study --download-m1
      - name: Preserve downloaded candle checkpoints
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/store
          key: fzasm-study-m1-${{ env.STUDY_YEAR }}-${{ matrix.pair }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish pair progress and results
        if: always()
        run: |
          if [ -f "reports/expanded-study/$STUDY_PAIR/STUDY_REPORT.md" ]; then
            cat "reports/expanded-study/$STUDY_PAIR/STUDY_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No replay report produced for $STUDY_PAIR; inspect collection/test step. Missing is not zero trades." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload pair reports including partial checkpoints
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: asm-expanded-${{ matrix.pair }}
          path: reports/expanded-study/${{ matrix.pair }}/
          if-no-files-found: warn
  aggregate:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Download available pair reports
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          pattern: asm-expanded-*
          path: pair-artifacts
      - name: Build monthly and yearly comparison without hiding missing pairs
        run: |
          mkdir -p pair-artifacts
          PYTHONPATH=. python scripts/merge_expanded_study.py --input pair-artifacts --out reports/expanded-summary --as-of "$STUDY_AS_OF"
          cat reports/expanded-summary/STUDY_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: asm-expanded-all-pairs-summary
          path: reports/expanded-summary/
