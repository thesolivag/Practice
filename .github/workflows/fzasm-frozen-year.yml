name: ASM frozen Jan–Oct 2026 corrected lifecycle study
on:
  push:
    branches: [FZ-ASM]
    paths: ['.github/workflows/fzasm-frozen-year.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fzasm-frozen-year
  cancel-in-progress: false
# Fixed once for all jobs: no pair gets a later outcome horizon.
env:
  STUDY_AS_OF: '2026-11-01T00:00:00Z'
  STUDY_YEAR: '2026'
jobs:
  backtest:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair: [USDJPY, EURJPY, GBPJPY, AUDJPY, NZDJPY, CADJPY, CHFJPY, XAUUSD, EURUSD, GBPUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STUDY_PAIR: ${{ matrix.pair }}
      SLK_STORE: data/store
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Verify timing, target accounting and monthly reconciliation
        run: PYTHONPATH=. pytest -q tests/test_fzasm*.py
      - uses: actions/cache/restore@v4
        with:
          path: data/store
          key: fzasm-study-m1-2026-${{ matrix.pair }}-43163729089-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/asm-warmup
          key: asm-dec2025-${{ matrix.pair }}-${{ github.run_id }}
          restore-keys: asm-dec2025-${{ matrix.pair }}-
      - name: Continuous replay with monthly report checkpoints
        timeout-minutes: 155
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: demo
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
        run: |
          PYTHONPATH=. python scripts/run_asm_frozen_year.py --pair "$STUDY_PAIR"
      - name: Preserve December warmup chunks
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@v4
        with:
          path: data/asm-warmup
          key: asm-dec2025-${{ matrix.pair }}-${{ github.run_id }}
      - name: Upload pair reports including partial checkpoints
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: asm-frozen-${{ matrix.pair }}
          path: reports/frozen-year/${{ matrix.pair }}/
          if-no-files-found: warn
  aggregate:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Download available pair reports
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          pattern: asm-frozen-*
          path: pair-artifacts
      - name: Build monthly and yearly comparison without hiding missing pairs
        run: |
          mkdir -p pair-artifacts
          PYTHONPATH=. python scripts/merge_asm_frozen_year.py
          cat reports/frozen-summary/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: asm-frozen-all-pairs-summary
          path: reports/frozen-summary/
