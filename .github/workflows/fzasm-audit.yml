name: ASM repaired execution regression checks
on:
  push:
    branches: [FZ-ASM]
    paths:
      - 'tests/test_fzasm*.py'
      - 'fzasm/**'
      - 'tests/data/nzdjpy_20261111_m1.csv'
      - .github/workflows/fzasm-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pytest
      - name: Verify repaired timing, confirmation and execution
        run: PYTHONPATH=. pytest -q tests/test_fzasm*.py --junitxml=audit-results.xml
      - name: Publish test result independently of artifact storage
        if: always()
        run: |
          python - <<'PYREPORT'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('audit-results.xml')
          if report.exists():
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              counts = {key: sum(int(s.get(key, '0')) for s in suites) for key in ('tests','failures','errors','skipped')}
              message = 'ASM regression results: ' + ', '.join(f'{key}={value}' for key,value in counts.items())
          else:
              message = 'ASM regression report unavailable; inspect the test step. No pass is claimed.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(message + '\n')
          PYREPORT
      - name: Upload optional audit evidence
        id: audit_upload
        uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: asm-defect-audit
          path: |
            audit-results.xml
            reports/FZ_ASM_NZDJPY_REFERENCE.md
            evidence/nzdjpy-reference/*.json
            reports/FZ_ASM_IMPLEMENTATION_AUDIT.md
            reports/FZ_ASM_REPAIR_HANDOFF.md
            reports/FZ_ASM_SOURCE_VALIDATION.md
            reports/FZ_ASM_SOURCE_REVIEW.html
            knowledge-base/frames/asm-key-level/sheets/sheet_003.jpg
            knowledge-base/frames/asm-key-level/sheets/sheet_006.jpg
            knowledge-base/frames/asm-asm-night-live-tarding-day-one/sheets/sheet_008.jpg
            knowledge-base/frames/asm-asm-night-live-tarding-day-one/sheets/sheet_009.jpg
            knowledge-base/frames/asm-all-you-need-asian-map-concept/sheets/sheet_005.jpg
      - name: Report artifact storage failure
        if: always() && steps.audit_upload.outcome == 'failure'
        run: |
          echo "::warning::Audit evidence upload failed or timed out; test results remain in the test log and run summary."
          echo "Artifact upload failed or timed out. This does not change the recorded test result." >> "$GITHUB_STEP_SUMMARY"
