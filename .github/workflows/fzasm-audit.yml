name: ASM repaired execution regression checks
on:
  push:
    branches: [FZ-ASM]
    paths:
      - 'tests/test_fzasm*.py'
      - 'fzasm/**'
      - .github/workflows/fzasm-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pytest
      - name: Verify repaired timing, confirmation and execution
        run: PYTHONPATH=. pytest -q tests/test_fzasm.py tests/test_fzasm_audit.py tests/test_fzasm_repaired.py --junitxml=audit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asm-defect-audit
          path: |
            audit-results.xml
            reports/FZ_ASM_IMPLEMENTATION_AUDIT.md
            reports/FZ_ASM_REPAIR_HANDOFF.md
