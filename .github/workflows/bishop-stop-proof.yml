name: Bishop proven minute stop audit
on:
  workflow_dispatch:
  push:
    branches: [claude-kevin-king]
    paths: ['.github/workflows/bishop-stop-proof.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: bishop-stop-proof-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pymysql requests websocket-client 'protobuf>=3.20' pytest
      - run: python -m pytest -q tests/test_bishop_stop_proof.py tests/test_bishop_unknown_jobs.py
      - uses: actions/download-artifact@v4
        with:
          pattern: unknown-*
          path: saved
          run-id: 42499187752
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: year-inputs
          path: year-inputs
          run-id: 42371042901
          github-token: ${{ github.token }}
      - run: python -m slk.bishop_stop_proof_jobs
      - run: cat report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stop-proof-report
          path: report/
          retention-days: 30
          overwrite: true
