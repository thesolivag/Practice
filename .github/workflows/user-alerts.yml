name: Personal alert checks and replay cache
on:
  workflow_dispatch:
    inputs:
      configure_only:
        description: "Sync private server broker configuration without checking watches"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: {group: slk-personal-alerts, cancel-in-progress: false}
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1410229777' }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_ENV: demo
      SLK_STORE: data/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pymysql 'protobuf>=3.20'
      - name: Configure private server broker access
        run: python -m slk.runtime_config --sync
      - name: Verify private server broker configuration
        if: inputs.configure_only
        run: |
          pip install -q requests 'protobuf>=3.20'
          python - <<'PYVERIFY'
          import os
          from ctrader.client import CTraderClient
          for name in ('CTRADER_CLIENT_ID','CTRADER_CLIENT_SECRET','CTRADER_ACCOUNT_ID','CTRADER_ENV','CTRADER_ACCESS_TOKEN','CTRADER_REFRESH_TOKEN'):
              os.environ.pop(name,None)
          with CTraderClient() as client:
              print('Database-only server broker authentication verified; no orders, candles or Telegram messages requested')
          PYVERIFY
      - name: Check pending work
        id: pending
        env:
          CONFIGURE_ONLY: ${{ inputs.configure_only && 'true' || 'false' }}
        run: |
          python - <<'PY'
          import os
          from slk import db
          if os.environ.get('CONFIGURE_ONLY')=='true':
              print('Private server configuration synced; watch checks were not requested')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('work=false\n')
          elif not os.environ.get('DATABASE_URL'):
              print('No database configured; skipping')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('work=false\n')
          else:
              db.apply_schema()
              active=db.query("SELECT COUNT(*) AS n FROM manual_alerts WHERE status IN ('ACTIVE','TRIGGERED')")[0]['n']
              replay=db.query("SELECT COUNT(*) AS n FROM replay_requests WHERE status='QUEUED'")[0]['n']
              print(f'Pending watches: {active}; replay windows: {replay}')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('work='+str(bool(active or replay)).lower()+'\n')
          PY
      - name: Install market dependencies only for pending work
        if: steps.pending.outputs.work == 'true'
        run: pip install -q pandas requests websocket-client 'protobuf>=3.20'
      - uses: actions/cache/restore@v4
        if: steps.pending.outputs.work == 'true'
        with:
          path: data/store
          key: personal-candles-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            personal-candles-v1-
            candles-v3-
      - name: Evaluate selected watches
        if: steps.pending.outputs.work == 'true'
        run: python -u -m slk.jobs alerts
      - name: Publish queued replay windows
        if: always() && steps.pending.outputs.work == 'true'
        run: python -u -m slk.replay_cache --publish
      - name: Preserve incremental history
        if: always() && steps.pending.outputs.work == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/store
          key: personal-candles-v1-${{ github.run_id }}-${{ github.run_attempt }}
