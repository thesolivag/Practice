name: ASM close-based CHoCH short validation
# Revalidate the fixed November sample after the closing-price pivot correction.
on:
  push:
    branches: [FZ-ASM]
    paths: ['.github/workflows/fzasm-native-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q tests/test_fzasm*.py
      - uses: actions/cache/restore@v4
        with:
          path: data/store
          key: fzasm-study-m1-2026-NZDJPY-43163729089-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/store
          key: fzasm-study-m1-2026-GBPUSD-43163729089-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/store
          key: fzasm-study-m1-2026-EURUSD-43163729089-1
          fail-on-cache-miss: true
      - name: Validate November 1–11 using cached M1 and native daily candles
        timeout-minutes: 20
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: demo
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
        run: PYTHONPATH=. python scripts/validate_asm_native_daily.py
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 3
        with:
          name: asm-native-daily-short-validation
          path: reports/native-daily-validation/
