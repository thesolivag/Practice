name: Read-only Forex feed health
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: slk-feed-health, cancel-in-progress: false}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_ENV: demo
      SLK_STORE: data/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas pymysql requests 'protobuf>=3.20'
      - uses: actions/cache/restore@v4
        with:
          path: data/store
          key: feed-health-${{ github.run_id }}
          restore-keys: candles-v3-
      - name: Inspect cache tails and request three fresh H1 feeds
        run: python -m slk.feed_health
